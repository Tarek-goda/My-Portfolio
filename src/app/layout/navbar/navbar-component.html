<header class="sticky top-0 z-40 border-b border-line bg-bg/85 backdrop-blur">
  <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5" aria-label="Main">
    <a routerLink="/" class="flex items-center gap-2.5" aria-label="Tarek Goda, home">
      <app-logo [size]="34" />
      <span class="font-display text-lg font-extrabold tracking-tight">Tarek Goda</span>
    </a>

    <ul class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="!text-accent"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="text-sm font-medium text-muted transition-colors hover:text-fg"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="btn btn-ghost !px-3"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (theme() === 'dark') {
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>

      @if (resume.url(); as url) {
        <a class="btn btn-primary hidden sm:inline-flex" [href]="url" target="_blank" rel="noopener noreferrer">
          Download CV
        </a>
      }

      <button
        type="button"
        class="btn btn-ghost !px-3 md:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle menu"
        (click)="menuOpen.update((v) => !v)"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6 6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>
    </div>
  </nav>

  @if (menuOpen()) {
    <ul class="rise border-t border-line px-5 py-3 md:hidden">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="!text-accent"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="block py-3 text-base font-medium text-muted"
            (click)="menuOpen.set(false)"
          >
            {{ link.label }}
          </a>
        </li>
      }
      @if (resume.url(); as url) {
        <li class="py-3">
          <a class="btn btn-primary w-full" [href]="url" target="_blank" rel="noopener noreferrer">Download CV</a>
        </li>
      }
    </ul>
  }
</header>

<main class="grid min-h-screen place-items-center px-5">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="rise w-full max-w-sm space-y-5 rounded-2xl border border-line bg-surface p-7"
    novalidate
  >
    <h1 class="font-display text-2xl font-extrabold">Admin login</h1>

    <div>
      <label class="label" for="email">Email</label>
      <input id="email" class="field" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="mt-1 text-sm text-red-500">Enter a valid email.</p>
      }
    </div>

    <div>
      <label class="label" for="password">Password</label>
      <input id="password" class="field" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    @if (error(); as message) {
      <p class="text-sm text-red-500" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn btn-primary w-full" [disabled]="loading()">
      @if (loading()) { <app-spinner size="sm" label="Signing in" /> }
      Sign in
    </button>
  </form>
</main>
